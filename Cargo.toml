[package]
name = "flashlog"
version = "0.1.1"
edition = "2021"
description = "Highlight errors, secrets, and stack traces in terminal output"
license = "MIT"
readme = "README.md"
repository = "https://github.com/horizzon3507/flashlog"

[dependencies]
regex = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[profile.release]
lto = true
strip = true
