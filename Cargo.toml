[package]
name = "flashlog"
version = "0.2.0"
edition = "2021"
description = "Highlight errors, secrets, and stack traces in terminal output"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/horizzon3507/flashlog"

[dependencies]
regex = { version = "1", default-features = false, features = [
    "std",
    "perf-cache",
    "perf-dfa",
    "perf-literal",
    "unicode-case",
    "unicode-perl",
] }

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
